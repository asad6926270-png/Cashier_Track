<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashier Tracker - Advanced</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f5f7fb;color:#111}header{background:#0f172a;color:#fff;padding:16px 18px;position:sticky;top:0;z-index:10}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.card b{font-size:20px;display:block;margin-top:6px}
.main{padding:0 12px 100px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn-primary{background:#0f172a;color:#fff;width:100%}
.chip{padding:6px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer}
.chip.active{background:#0f172a;color:#fff}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:6px}
label{font-size:12px;font-weight:600;margin-top:12px;display:block}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.sms-box{background:#fffbeb;border:1px dashed #f59e0b;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>💰 Cashier Tracker</h1>
<p>Offline • Auto SMS Parser</p>
</header>
<div class="cards">
<div class="card"><span>Today</span><b id="todayTotal">Rs. 0</b></div>
<div class="card"><span>This Month</span><b id="monthTotal">Rs. 0</b></div>
</div>
<div class="main">
<div class="sms-box">
<label>📩 Paste Easypaisa / JazzCash SMS here</label>
<textarea id="smsInput" rows="3" placeholder="You have received Rs. 1500.00 from 0300..."></textarea>
<button class="btn btn-primary" style="margin-top:8px" onclick="parseSMS()">Auto Parse SMS</button>
<small id="parseResult" style="color:#059669"></small>
</div>
<label>Search</label><input id="search" placeholder="Search..." oninput="render()">
<div id="list" style="margin-top:12px"></div>
<div style="background:#fff;border-radius:16px;padding:16px;margin-top:18px">
<h3>+ Add Payment</h3>
<label>Amount Rs.</label><input id="amount" type="number">
<label>Customer Name</label><input id="name">
<label>Phone</label><input id="phone">
<div style="margin-top:8px;display:flex;gap:8px" id="typeChips">
<span class="chip active" data-v="Easypaisa" onclick="setType(this)">Easypaisa</span>
<span class="chip" data-v="JazzCash" onclick="setType(this)">JazzCash</span>
<span class="chip" data-v="Cash" onclick="setType(this)">Cash</span>
</div>
<label>Note</label><input id="note">
<button class="btn btn-primary" style="margin-top:14px" onclick="addRecord()">Save Record</button>
<button class="btn" style="margin-top:8px;background:#fff;border:1px solid #ddd" onclick="exportCSV()">Export Excel</button>
</div>
</div>
<script>
let selectedType='Easypaisa';let data=JSON.parse(localStorage.getItem('cashier_data')||'[]');
function setType(el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');selectedType=el.dataset.v;}
function save(){localStorage.setItem('cashier_data',JSON.stringify(data));render();}
function addRecord(){const amt=parseFloat(document.getElementById('amount').value);if(!amt){alert('Enter amount');return;}const rec={id:Date.now(),amount:amt,name:document.getElementById('name').value||'Unknown',phone:document.getElementById('phone').value||'',type:selectedType,note:document.getElementById('note').value||'',date:new Date().toISOString()};data.unshift(rec);save();document.getElementById('amount').value='';alert('Saved!');}
function parseSMS(){const txt=document.getElementById('smsInput').value.trim();if(!txt)return;let amtMatch=txt.match(/(?:Rs\.?|PKR)\s*([\d,]+\.?\d*)/i);let phoneMatch=txt.match(/(0\d{9,10})/);let amt=amtMatch?parseFloat(amtMatch[1].replace(/,/g,'')):0;let ph=phoneMatch?phoneMatch[1]:'';document.getElementById('amount').value=amt||'';document.getElementById('phone').value=ph||'';if(txt.toLowerCase().includes('jazz'))setType(document.querySelector('[data-v="JazzCash"]'));document.getElementById('parseResult').innerText=amt?`Parsed: Rs. ${amt} ${ph?'from '+ph:''}`:'Could not parse';}
function render(){const q=document.getElementById('search').value.toLowerCase();const filtered=data.filter(r=>(r.name+r.phone).toLowerCase().includes(q));let today=new Date().toDateString();let todaySum=data.filter(r=>new Date(r.date).toDateString()===today).reduce((s,r)=>s+r.amount,0);let month=new Date().getMonth();let monthSum=data.filter(r=>new Date(r.date).getMonth()===month).reduce((s,r)=>s+r.amount,0);document.getElementById('todayTotal').innerText='Rs. '+todaySum;document.getElementById('monthTotal').innerText='Rs. '+monthSum;let html='';filtered.forEach(r=>{html+=`<div class="item"><div><b>Rs. ${r.amount}</b> • ${r.name}<br><small>${r.type} | ${r.phone}</small></div><div onclick="data=data.filter(x=>x.id!==${r.id});save()" style="color:red">✕</div></div>`});document.getElementById('list').innerHTML=html||'No records';}
function exportCSV(){let csv='Date,Amount,Name,Phone,Type\n'+data.map(r=>`${new Date(r.date).toLocaleString()},${r.amount},${r.name},${r.phone},${r.type}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='report.csv';a.click();}
render();
</script>
</body>
</html>
